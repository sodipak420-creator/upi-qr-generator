<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant UPI QR Code Generator</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 mt-4 mb-8">
    <!-- PWA Install Banner -->
    <div id="installBanner" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-emerald-400">Install UPI QR Maker</p>
        <p class="text-slate-400">Add to home screen for instant checkout QR codes</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold rounded-lg transition-all">
        Install
      </button>
    </div>

    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold text-emerald-400">Instant UPI QR Maker</h1>
      <p class="text-xs text-slate-400 mt-1">Accept GPay, PhonePe, Paytm & BHIM Payments</p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Your UPI ID (VPA)</label>
        <input id="upiId" type="text" placeholder="example@okhdfcbank" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 font-mono text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Payee Name</label>
          <input id="payeeName" type="text" placeholder="Shop / Your Name" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Amount (₹ Optional)</label>
          <input id="amount" type="number" step="1" placeholder="Leave empty for open" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 font-mono text-sm focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <button onclick="generateQRCode()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold py-2.5 rounded-lg text-slate-950 text-sm transition-colors">
        Generate Payment QR
      </button>
    </div>

    <!-- QR Code Preview Card -->
    <div id="qrSection" class="hidden mt-6 pt-5 border-t border-slate-700 text-center">
      <div id="qrCard" class="bg-white p-5 rounded-2xl inline-block shadow-lg mx-auto">
        <p id="qrTitle" class="text-slate-900 font-bold text-sm mb-1 uppercase tracking-wide"></p>
        <p id="qrVpa" class="text-[11px] text-slate-500 font-mono mb-3"></p>
        <div id="qrcode" class="flex justify-center my-2"></div>
        <p id="qrAmount" class="text-emerald-700 font-extrabold text-lg mt-2 font-mono"></p>
        <p class="text-[10px] text-slate-400 uppercase mt-1">Scan with Any UPI App</p>
      </div>

      <div class="mt-4">
        <button onclick="downloadQR()" class="w-full bg-sky-500 hover:bg-sky-600 font-semibold py-2.5 rounded-lg text-slate-950 text-sm transition-colors">
          Download QR Image (PNG)
        </button>
      </div>
    </div>

    <!-- Adsterra Monetization Slot -->
    <div class="mt-6 pt-4 border-t border-slate-700/60 flex justify-center">
      <iframe srcdoc="<!DOCTYPE html><html><head></head><body style='margin:0;display:flex;justify-content:center;'><script type='text/javascript'>atOptions={'key':'45775fbece61c0f117b4d413d29f50b6','format':'iframe','height':50,'width':320,'params':{}};</script><script type='text/javascript' src='https://www.highrevenueformat.com/45775fbece61c0f117b4d413d29f50b6/invoke.js'></script></body></html>" width="320" height="50" style="border:none; overflow:hidden;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation"></iframe>
    </div>
  </main>

  <script>
    let qrInstance = null;
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    function generateQRCode() {
      const upi = document.getElementById('upiId').value.trim();
      const name = document.getElementById('payeeName').value.trim() || 'Merchant';
      const amt = document.getElementById('amount').value.trim();

      if (!upi || !upi.includes('@')) {
        alert('Please enter a valid UPI ID (e.g. name@okhdfcbank)');
        return;
      }

      let upiUrl = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&cu=INR`;
      if (amt && parseFloat(amt) > 0) {
        upiUrl += `&am=${encodeURIComponent(amt)}`;
        document.getElementById('qrAmount').innerText = `₹${parseFloat(amt).toFixed(2)}`;
      } else {
        document.getElementById('qrAmount').innerText = 'Custom Amount';
      }

      document.getElementById('qrTitle').innerText = name;
      document.getElementById('qrVpa').innerText = upi;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      qrInstance = new QRCode(qrContainer, {
        text: upiUrl,
        width: 180,
        height: 180,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('qrSection').classList.remove('hidden');
    }

    function downloadQR() {
      const img = document.querySelector('#qrcode img');
      if (!img) return;

      const link = document.createElement('a');
      link.download = 'payment-upi-qr.png';
      link.href = img.src;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Registered'))
          .catch((err) => console.log('SW Error', err));
      });
    }
  </script>
</body>
</html>
