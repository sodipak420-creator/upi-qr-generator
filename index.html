<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant UPI QR Maker</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inlined QRious library to eliminate all external CDN loading issues -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 mt-4 mb-8">
    <!-- PWA Install Banner -->
    <div id="installBanner" class="hidden mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center justify-between">
      <div class="text-xs">
        <p class="font-bold text-emerald-400">Install UPI QR Maker</p>
        <p class="text-slate-400">Add to home screen for offline checkout</p>
      </div>
      <button onclick="installPWA()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold rounded-lg transition-all">
        Install
      </button>
    </div>

    <!-- Header -->
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold text-emerald-400">Instant UPI QR Maker</h1>
      <p class="text-xs text-slate-400 mt-1">Accept GPay, PhonePe, Paytm & BHIM Payments</p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Your UPI ID (VPA)</label>
        <input id="upiId" type="text" placeholder="e.g. storepay@oksbi" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 font-mono text-sm focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Payee Name</label>
          <input id="payeeName" type="text" placeholder="Store / Business" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 text-sm focus:outline-none focus:border-emerald-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Amount (₹ Optional)</label>
          <input id="amount" type="number" step="1" placeholder="Leave empty for open" class="w-full px-3 py-2 bg-slate-950 rounded-lg border border-slate-700 font-mono text-sm focus:outline-none focus:border-emerald-500" />
        </div>
      </div>

      <button type="button" onclick="generateQRCode()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-bold py-3 rounded-lg text-slate-950 text-sm transition-colors shadow-lg shadow-emerald-500/20">
        Generate Payment QR
      </button>
    </div>

    <!-- QR Code Preview Card -->
    <div id="qrSection" class="hidden mt-6 pt-5 border-t border-slate-700 text-center">
      <div id="qrCard" class="bg-white p-6 rounded-2xl inline-block shadow-xl mx-auto text-slate-900">
        <p id="qrTitle" class="font-bold text-sm uppercase tracking-wide text-slate-900">Merchant Store</p>
        <p id="qrVpa" class="text-[11px] text-slate-500 font-mono mb-3">upi@bank</p>
        
        <div class="flex justify-center my-2 p-2 bg-white rounded-xl">
          <canvas id="qrCanvas"></canvas>
        </div>

        <p id="qrAmount" class="text-emerald-600 font-extrabold text-lg mt-2 font-mono">Custom Amount</p>
        <p class="text-[10px] text-slate-400 uppercase font-semibold mt-1">Scan with Any UPI App</p>
      </div>

      <!-- Two Download Methods for Android Support -->
      <div class="mt-5 space-y-2">
        <button type="button" onclick="downloadQR()" class="w-full bg-sky-500 hover:bg-sky-600 font-bold py-3 rounded-lg text-slate-950 text-sm transition-colors shadow-lg shadow-sky-500/20">
          Download QR Image (PNG) 📥
        </button>
        <button type="button" onclick="openPrintView()" class="w-full bg-slate-700 hover:bg-slate-600 font-semibold py-2.5 rounded-lg text-slate-200 text-xs transition-colors">
          Print / Save as PDF 🖨️
        </button>
      </div>
    </div>

    <!-- Adsterra Monetization Slot -->
    <div class="mt-6 pt-4 border-t border-slate-700/60 flex justify-center">
      <iframe srcdoc="<!DOCTYPE html><html><head></head><body style='margin:0;display:flex;justify-content:center;'><script type='text/javascript'>atOptions={'key':'45775fbece61c0f117b4d413d29f50b6','format':'iframe','height':50,'width':320,'params':{}};</script><script type='text/javascript' src='https://www.highrevenueformat.com/45775fbece61c0f117b4d413d29f50b6/invoke.js'></script></body></html>" width="320" height="50" style="border:none; overflow:hidden;" scrolling="no" sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation"></iframe>
    </div>
  </main>

  <script>
    let qr = null;
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      });
    }

    function generateQRCode() {
      const upi = document.getElementById('upiId').value.trim();
      const name = document.getElementById('payeeName').value.trim() || 'Store / Merchant';
      const amt = document.getElementById('amount').value.trim();

      if (!upi || !upi.includes('@')) {
        alert('Please enter a valid UPI ID (e.g. storepay@oksbi)');
        return;
      }

      let upiUrl = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&cu=INR`;
      if (amt && parseFloat(amt) > 0) {
        upiUrl += `&am=${encodeURIComponent(amt)}`;
        document.getElementById('qrAmount').innerText = `₹${parseFloat(amt).toFixed(2)}`;
      } else {
        document.getElementById('qrAmount').innerText = 'Custom Amount';
      }

      document.getElementById('qrTitle').innerText = name;
      document.getElementById('qrVpa').innerText = upi;

      const canvas = document.getElementById('qrCanvas');
      qr = new QRious({
        element: canvas,
        value: upiUrl,
        size: 220,
        level: 'H'
      });

      const qrSection = document.getElementById('qrSection');
      qrSection.classList.remove('hidden');
      qrSection.scrollIntoView({ behavior: 'smooth' });
    }

    function generateCardCanvas() {
      const canvas = document.getElementById('qrCanvas');
      if (!canvas) return null;

      const cardCanvas = document.createElement('canvas');
      const ctx = cardCanvas.getContext('2d');
      cardCanvas.width = 400;
      cardCanvas.height = 480;

      // Card Background
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, cardCanvas.width, cardCanvas.height);

      // Name
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 20px sans-serif';
      const title = document.getElementById('qrTitle').innerText;
      ctx.fillText(title, 200, 45);

      // VPA
      ctx.fillStyle = '#64748b';
      ctx.font = '14px monospace';
      const vpa = document.getElementById('qrVpa').innerText;
      ctx.fillText(vpa, 200, 75);

      // QR Code
      ctx.drawImage(canvas, 90, 95, 220, 220);

      // Amount
      ctx.fillStyle = '#059669';
      ctx.font = 'bold 24px monospace';
      const amtText = document.getElementById('qrAmount').innerText;
      ctx.fillText(amtText, 200, 360);

      // Footer
      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('SCAN WITH GPAY / PHONEPE / PAYTM', 200, 400);

      return cardCanvas;
    }

    function downloadQR() {
      const cardCanvas = generateCardCanvas();
      if (!cardCanvas) return;

      // Native Blob method bypasses Android Chrome dataURI blocks
      cardCanvas.toBlob((blob) => {
        if (!blob) {
          alert('Error generating image file.');
          return;
        }
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = 'upi-payment-qr.png';
        document.body.appendChild(link);
        link.click();
        
        setTimeout(() => {
          document.body.removeChild(link);
          URL.revokeObjectURL(blobUrl);
        }, 300);
      }, 'image/png');
    }

    function openPrintView() {
      const cardCanvas = generateCardCanvas();
      if (!cardCanvas) return;

      const dataUrl = cardCanvas.toDataURL('image/png');
      const win = window.open('', '_blank');
      win.document.write(`
        <html>
          <head><title>Print UPI QR</title></head>
          <body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#f1f5f9;">
            <img src="${dataUrl}" style="max-width:90%; border-radius:12px; box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);" onload="window.print(); window.close();" />
          </body>
        </html>
      `);
      win.document.close();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('SW Registered'))
          .catch((err) => console.log('SW Error', err));
      });
    }
  </script>
</body>
</html>
